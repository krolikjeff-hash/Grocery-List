<title>Shopping List</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style id="style-tag">:root {
  --bg: #f2f4ec;
  --surface: #ffffff;
  --surface-2: #eaeee0;
  --ink: #1e2a1e;
  --muted: #5b6558;
  --border: #dbe1cf;
  --primary: #2f5f42;
  --primary-ink: #ffffff;
  --accent: #e2532b;
  --accent-ink: #ffffff;
  --good: #2f5f42;
  --shadow: 0 1px 2px rgba(30, 42, 30, 0.06), 0 6px 16px -8px rgba(30, 42, 30, 0.18);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131d16;
    --surface: #1b2720;
    --surface-2: #223028;
    --ink: #eaf1e6;
    --muted: #9bb09d;
    --border: #2b3a30;
    --primary: #7fc08e;
    --primary-ink: #0e1a10;
    --accent: #ff7d52;
    --accent-ink: #241006;
    --good: #7fc08e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #131d16;
  --surface: #1b2720;
  --surface-2: #223028;
  --ink: #eaf1e6;
  --muted: #9bb09d;
  --border: #2b3a30;
  --primary: #7fc08e;
  --primary-ink: #0e1a10;
  --accent: #ff7d52;
  --accent-ink: #241006;
  --good: #7fc08e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}

header.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 12px;
}

header.top .inner {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

h1.brand {
  font-family: "Fraunces", Georgia, serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-size: 22px;
  margin: 0;
  letter-spacing: -0.01em;
  color: var(--ink);
}

h1.brand span {
  color: var(--primary);
}

.count-pill {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

section { margin-top: 28px; }

.section-head-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.collapse-toggle {
  flex: none;
  font-family: inherit;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--primary);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 2px;
}

h2.section-title {
  font-family: "Fraunces", Georgia, serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-size: 19px;
  margin: 0 0 4px;
  letter-spacing: -0.005em;
}

p.section-sub {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13.5px;
}

.list-section {
  margin-top: 32px;
  margin-left: -16px;
  margin-right: -16px;
}

.list-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--primary);
  color: var(--primary-ink);
  padding: 14px 16px;
  border-radius: 14px 14px 0 0;
  font-family: "Fraunces", Georgia, serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.005em;
}

.list-banner-icon { font-size: 21px; }

.list-panel {
  background: color-mix(in srgb, var(--primary) 6%, var(--surface));
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 14px 14px;
  padding: 14px 16px 18px;
}

.list-panel p.section-sub { margin-top: -2px; }

.recipe-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.recipe-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.recipe-row input[type="checkbox"] {
  width: 22px;
  height: 22px;
  flex: none;
  accent-color: var(--primary);
}

.recipe-row .meta {
  flex: 1;
  min-width: 0;
}

.recipe-row .name {
  font-weight: 600;
  font-size: 15.5px;
  color: var(--ink);
}

.recipe-row .time {
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

.recipe-row.selected {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 8%, var(--surface));
}

.cat-group { margin-bottom: 18px; }

.cat-group h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 8px;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px;
  border-bottom: 1px solid var(--border);
}

.item-row:last-child { border-bottom: none; }

.item-row .tap-area {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 9px 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.item-row input[type="checkbox"] {
  width: 21px;
  height: 21px;
  flex: none;
  margin-top: 2px;
  accent-color: var(--primary);
}

.item-row .text {
  flex: 1;
  min-width: 0;
}

.item-row .name {
  font-size: 15px;
  color: var(--ink);
}

.item-row.checked .name {
  color: var(--muted);
  text-decoration: line-through;
}

.item-row .qty {
  font-size: 12.5px;
  color: var(--muted);
}

.item-row .del {
  flex: none;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  padding: 4px 6px;
  cursor: pointer;
  border-radius: 6px;
}

.item-row .del:hover { background: var(--surface-2); color: var(--ink); }

.empty-note {
  color: var(--muted);
  font-size: 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 18px;
  text-align: center;
}

form.add-item {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

form.add-item input[type="text"] {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
}

form.add-item input[type="text"]:focus {
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}

select.cat-select {
  font-size: 13px;
  padding: 10px 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  max-width: 120px;
}

@media (prefers-reduced-motion: no-preference) {
  select.cat-select-guessed {
    animation: cat-guess-pulse 0.6s ease-out;
  }
  @keyframes cat-guess-pulse {
    0% { background: color-mix(in srgb, var(--primary) 35%, var(--surface)); border-color: var(--primary); }
    100% { background: var(--surface); border-color: var(--border); }
  }
}

button.btn {
  font-family: inherit;
  font-weight: 600;
  font-size: 14.5px;
  border-radius: 10px;
  border: 1px solid transparent;
  padding: 10px 16px;
  cursor: pointer;
}

button.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

button.btn.primary { background: var(--accent); color: var(--accent-ink); }
button.btn.primary:active { opacity: 0.85; }

button.btn.ghost {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--border);
}

button.btn.ghost:active { background: var(--surface-2); }

footer.util {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
}

footer.util .inner {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
}

footer.util button.btn { flex: 1; }

.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20, 26, 20, 0.5);
  z-index: 50;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.confirm-overlay.open { display: flex; }

.confirm-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  max-width: 340px;
  width: 100%;
  box-shadow: var(--shadow);
}

.confirm-text {
  margin: 0 0 16px;
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
}

.confirm-actions {
  display: flex;
  gap: 8px;
}

.confirm-actions .btn { flex: 1; }

.sync-flag {
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
  margin: 4px 0 0;
  min-height: 14px;
}

.sync-flag-warn {
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .recipe-row, .item-row .name { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
}
</style>

<div class="wrap" id="app-root"><div id="app"></div></div>
<footer class="util"><div class="inner">
  <button class="btn ghost" id="btn-uncheck" type="button">Uncheck all</button>
  <button class="btn ghost" id="btn-reset" type="button">Start new list</button>
</div><p class="sync-flag" id="sync-flag"></p></footer>
<div class="confirm-overlay" id="confirm-overlay"><div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
  <p class="confirm-text" id="confirm-text">Start a new list? This clears selected meals, custom items, and checkmarks for everyone.</p>
  <div class="confirm-actions">
    <button class="btn ghost" id="confirm-cancel" type="button">Cancel</button>
    <button class="btn primary" id="confirm-ok" type="button">Start new list</button>
  </div>
</div></div>

    var toggleBtn = el('button', { class: 'collapse-toggle', type: 'button', text: toggleLabel });
    toggleBtn.addEventListener('click', function () { setRecipesExpanded(!recipesExpanded); render(); });
    headRow.appendChild(titleWrap);
    headRow.appendChild(toggleBtn);
    section.appendChild(headRow);

    if (recipesExpanded) {
      var list = el('div', { class: 'recipe-list' });
      RECIPES.forEach(function (r) {
        var checked = STATE.selectedRecipes.indexOf(r.name) !== -1;
        var cb = el('input', { type: 'checkbox' });
        cb.checked = checked;
        cb.addEventListener('change', function () { toggleRecipe(r.name); });
        var row = el('label', { class: 'recipe-row' + (checked ? ' selected' : '') }, [
          cb,
          el('div', { class: 'meta' }, [
            el('div', { class: 'name', text: r.name }),
            el('div', { class: 'time', text: r.time })
          ])
        ]);
        list.appendChild(row);
      });
      section.appendChild(list);
    }
    return section;
  }

  function buildListSection() {
    var section = el('section', { id: 'list-section', class: 'list-section' });
    var banner = el('div', { class: 'list-banner' }, [
      el('span', { class: 'list-banner-icon', text: '🛒' }),
      el('span', { text: 'Shopping List' })
    ]);
    section.appendChild(banner);

    var panel = el('div', { class: 'list-panel' });
    panel.appendChild(el('p', { class: 'section-sub', text: 'Grouped by aisle. Tap to check off at the store.' }));

    var byCategory = computeList(STATE);
    var any = false;
    CATEGORY_ORDER.forEach(function (cat) {
      var rows = byCategory[cat];
      if (!rows || !rows.length) return;
      any = true;
      var group = el('div', { class: 'cat-group' });
      group.appendChild(el('h3', { text: cat }));
      rows.forEach(function (row) {
        var cb = el('input', { type: 'checkbox' });
        cb.checked = row.checked;
        cb.addEventListener('change', function () { toggleChecked(row.key); });
        var textWrap = el('div', { class: 'text' }, [
          el('div', { class: 'name', text: row.name })
        ].concat(row.qtyText ? [el('div', { class: 'qty', text: row.qtyText })] : []));
        var tapLabel = el('label', { class: 'tap-area' }, [cb, textWrap]);
        var delBtn = el('button', { class: 'del', text: '×', 'aria-label': 'Remove ' + row.name, type: 'button' });
        delBtn.addEventListener('click', function (ev) { ev.stopPropagation(); removeItem(row); });
        var itemRow = el('div', { class: 'item-row' + (row.checked ? ' checked' : '') }, [tapLabel, delBtn]);
        group.appendChild(itemRow);
      });
      panel.appendChild(group);
    });

    if (!any) {
      panel.appendChild(el('div', { class: 'empty-note', text: 'Select a meal above, or add an item below, to start your list.' }));
    }

    var form = el('form', { class: 'add-item' });
    var input = el('input', { type: 'text', placeholder: 'Add an item…', 'aria-label': 'New item name' });
    var select = el('select', { class: 'cat-select', 'aria-label': 'Category (guessed automatically as you type)' });
    CATEGORY_ORDER.forEach(function (c) {
      var opt = el('option', { value: c, text: c });
      if (c === 'Other') opt.selected = true;
      select.appendChild(opt);
    });
    var addBtn = el('button', { class: 'btn primary', type: 'submit', text: 'Add' });
    form.appendChild(input); form.appendChild(select); form.appendChild(addBtn);

    var userPickedCategory = false;
    select.addEventListener('change', function () { userPickedCategory = true; });
    input.addEventListener('input', function () {
      if (userPickedCategory) return;
      var guess = guessCategory(input.value) || 'Other';
      if (select.value !== guess) {
        select.value = guess;
        select.classList.remove('cat-select-guessed');
        void select.offsetWidth;
        select.classList.add('cat-select-guessed');
      }
    });

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      addCustomItem(name, select.value);
      input.value = '';
      select.value = 'Other';
      userPickedCategory = false;
      input.focus();
    });
    panel.appendChild(form);

    section.appendChild(panel);
    return section;
  }

  function toggleRecipe(name) {
    var s = cloneState();
    var i = s.selectedRecipes.indexOf(name);
    if (i === -1) s.selectedRecipes.push(name); else s.selectedRecipes.splice(i, 1);
    commit(s);
  }

  function toggleChecked(key) {
    var s = cloneState();
    var i = s.checkedKeys.indexOf(key);
    if (i === -1) s.checkedKeys.push(key); else s.checkedKeys.splice(i, 1);
    commit(s);
  }

  function removeItem(row) {
    var s = cloneState();
    if (row.custom) {
      var id = row.key.replace('custom::', '');
      s.customItems = s.customItems.filter(function (it) { return it.id !== id; });
    } else {
      if (s.removedKeys.indexOf(row.key) === -1) s.removedKeys.push(row.key);
    }
    s.checkedKeys = s.checkedKeys.filter(function (k) { return k !== row.key; });
    commit(s);
  }

  function addCustomItem(name, category) {
    var s = cloneState();
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    s.customItems.push({ id: id, name: name, qty: '', category: category || 'Other' });
    commit(s);
  }

  function uncheckAll() {
    var s = cloneState();
    s.checkedKeys = [];
    commit(s);
  }

  function openResetConfirm() {
    var overlay = document.getElementById('confirm-overlay');
    if (overlay) overlay.classList.add('open');
  }

  function closeResetConfirm() {
    var overlay = document.getElementById('confirm-overlay');
    if (overlay) overlay.classList.remove('open');
  }

  function cloneState() {
    return JSON.parse(JSON.stringify(STATE));
  }

  // ---- Firestore wiring ----
  // Everyone who opens this page reads and writes the same single document.
  // Firestore's own SDK handles offline queueing, retry, and real-time push
  // to every other open tab/phone — no hand-rolled retry/backoff needed here.
  var db = null;
  var docRef = null;
  var writeTimer = null;
  var firebaseReady = window.__firebaseReady; // set by the module script below

  function updateSyncFlag(mode) {
    var flag = document.getElementById('sync-flag');
    if (!flag) return;
    flag.className = 'sync-flag';
    flag.onclick = null;
    if (mode === 'saving') {
      flag.textContent = 'Saving…';
    } else if (mode === 'saved') {
      flag.textContent = '';
    } else if (mode === 'offline') {
      flag.textContent = 'Offline — showing last saved list, will sync when back online';
      flag.classList.add('sync-flag-warn');
    } else if (mode === 'error') {
      flag.textContent = 'Could not connect (tap to retry)';
      flag.classList.add('sync-flag-warn');
      flag.onclick = function () { window.location.reload(); };
    }
  }

  function commit(newState) {
    STATE = newState;
    render();
    if (!docRef) return;
    updateSyncFlag('saving');
    clearTimeout(writeTimer);
    writeTimer = setTimeout(function () {
      window.__firestoreSetDoc(docRef, newState).catch(function () {
        // The SDK already queued this write locally and will retry once
        // connectivity returns, so this just reflects that back visually.
        updateSyncFlag('offline');
      });
    }, 250);
  }

  function startFirestoreSync(firebaseApp, firestoreExports) {
    db = firestoreExports.db;
    docRef = firestoreExports.docRef;
    window.__firestoreSetDoc = firestoreExports.setDoc;

    firestoreExports.onSnapshot(docRef, { includeMetadataChanges: true }, function (snap) {
      if (snap.exists()) {
        STATE = normalizeState(snap.data());
      } else {
        STATE = defaultState();
        firestoreExports.setDoc(docRef, STATE).catch(function () {});
      }
      loaded = true;
      render();
      if (snap.metadata.hasPendingWrites) {
        updateSyncFlag('saving');
      } else if (snap.metadata.fromCache) {
        updateSyncFlag('offline');
      } else {
        updateSyncFlag('saved');
      }
    }, function () {
      updateSyncFlag('error');
    });
  }

  function wireFooter() {
    var u = document.getElementById('btn-uncheck');
    var r = document.getElementById('btn-reset');
    if (u) u.addEventListener('click', uncheckAll);
    if (r) r.addEventListener('click', openResetConfirm);

    var overlay = document.getElementById('confirm-overlay');
    var cancelBtn = document.getElementById('confirm-cancel');
    var okBtn = document.getElementById('confirm-ok');
    if (cancelBtn) cancelBtn.addEventListener('click', closeResetConfirm);
    if (okBtn) okBtn.addEventListener('click', function () {
      closeResetConfirm();
      commit(defaultState());
    });
    if (overlay) {
      overlay.addEventListener('click', function (ev) {
        if (ev.target === overlay) closeResetConfirm();
      });
    }
    try {
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') closeResetConfirm();
      });
    } catch (e) {}
  }

  function init() {
    appEl = document.getElementById('app');
    var styleTag = document.getElementById('style-tag');
    if (styleTag && !styleTag.textContent) styleTag.textContent = CSS_TEXT;
    render();
    wireFooter();
  }

  init();

  // Exposed so the module-type Firebase bootstrap script (which must live in
  // its own <script type="module"> tag to use import syntax) can hand the
  // initialized Firestore pieces back into this plain script once ready.
  window.__startFirestoreSync = startFirestoreSync;
  window.__onFirestoreError = function () { updateSyncFlag('error'); };
})();

</script>
